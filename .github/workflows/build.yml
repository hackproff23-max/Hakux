name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  NDK_VER: 29.0.14206865

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: FEX e submodulos
        run: |
          git submodule update --init external/fex
          git -C external/fex submodule update --init External/fmt External/range-v3 \
            External/rpmalloc External/unordered_dense External/xxhash Source/Common/cpp-optparse

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: SDK, NDK, CMake
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.1.0" "ndk;${NDK_VER}"
          sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Dependencias de terceiros (NC_DEPS)
        run: |
          D=$HOME/native-deps
          mkdir -p $D/root/subprojects
          git clone --depth 1 -b 1.4.304 https://github.com/zeux/volk $D/volk
          git clone --depth 1 -b 16.1.0 https://github.com/KhronosGroup/glslang $D/glslang
          git clone --depth 1 -b vulkan-sdk-1.4.328.0 https://github.com/KhronosGroup/SPIRV-Reflect $D/spirv_reflect
          git clone --depth 1 -b v3.3.0 https://github.com/GPUOpen-LibrariesAndSDKs/VulkanMemoryAllocator $D/vma
          git clone --depth 1 -b release-3.4.18 https://github.com/libsdl-org/SDL $D/SDL3
          git clone --depth 1 -b v4.9.1 https://gitlab.freedesktop.org/slirp/libslirp $D/libslirp
          git clone https://github.com/bylaws/libadrenotools $D/adrenotools
          git -C $D/adrenotools checkout 8fae8ce
          git -C $D/adrenotools submodule update --init --recursive
          git -C $D/adrenotools apply $GITHUB_WORKSPACE/tools/native/adrenotools-kgsl-context-priority.patch
          git clone https://github.com/abaire/nv2a_vsh_cpu $D/root/subprojects/nv2a_vsh_cpu
          git -C $D/root/subprojects/nv2a_vsh_cpu checkout 89315e8
          echo "NC_DEPS=$D" >> $GITHUB_ENV

      - name: Compilar o nucleo
        run: |
          NDK=$ANDROID_HOME/ndk/${NDK_VER}
          cmake -S native -B build/native/core -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=$NDK/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a -DCMAKE_CXX_SCAN_FOR_MODULES=OFF -DANDROID_PLATFORM=android-28 \
            -DCMAKE_BUILD_TYPE=Release -DNC_DEPS=$NC_DEPS
          ninja -C build/native/core hakuxcore

      - name: Copiar bibliotecas para o jniLibs
        run: |
          sed -i 's#windows-x86_64#linux-x86_64#; s#llvm-strip\.exe#llvm-strip#' tools/native/app-libs.sh
          ANDROID_NDK=$ANDROID_HOME/ndk/${NDK_VER} bash tools/native/app-libs.sh

      - name: Gerar o APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: hakuX-apk
          path: android/app/build/outputs/apk/**/*.apk
